name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Check bundle size
        run: |
          DIST_SIZE=$(du -sk dist/ | cut -f1)
          echo "Bundle size: ${DIST_SIZE}KB"
          if [ "$DIST_SIZE" -gt 5120 ]; then
            echo "::warning::Bundle size ${DIST_SIZE}KB exceeds 5MB budget"
          fi
